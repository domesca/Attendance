<!DOCTYPE html>
<html>
<head>
  <title>Across Land - Warehouse Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>Across Land</h2>
<h3>Warehouse Attendance</h3>

<label>Name:</label>
<input type="text" id="name" placeholder="Enter your name">

<br>

<button onclick="submitAttendance('in')">Check In</button>
<button onclick="submitAttendance('out')">Check Out</button>

<script>

async function getIP() {
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip;
  } catch {
    return "unknown";
  }
}

async function submitAttendance(action) {

  const name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Please enter your name");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {

      const ip = await getIP();

      const formData = new URLSearchParams();

      formData.append("name", name);
      formData.append("action", action);
      formData.append("lat", pos.coords.latitude);
      formData.append("lon", pos.coords.longitude);
      formData.append("ip", ip);
      formData.append("timestamp", new Date().toISOString());

      try {

        await fetch(
          "https://script.google.com/macros/s/AKfycbxtEeMIPu9fsdDDZpJMX_gVIUewdMFFHw_7nYgZ3UfOAyo2caehTCrX0lLMTm-jX6iU/exec",
          {
            method: "POST",
            mode: "no-cors",
            body: formData
          }
        );

        alert(
          "Attendance submitted successfully.\n\n" +
          "Name: " + name +
          "\nAction: " + action
        );

      } catch (err) {

        console.error(err);

        alert(
          "Submission failed:\n" +
          err.message
        );
      }
    },

    () => {
      alert("Please allow location access.");
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

</script>

</body>
</html>
